# Gera o APK do aplicativo CHECK-ON (apps/mobile) na nuvem da Expo e publica em "Releases".
#
# Configuração (uma vez): crie um token em https://expo.dev → Account settings → Access tokens
# e salve no GitHub em Settings → Secrets and variables → Actions → New repository secret,
# com o nome EXPO_TOKEN.
#
# Quando roda:
#   - manualmente: aba Actions → "APK do aplicativo" → Run workflow;
#   - sozinho: quando a versão do app muda em apps/mobile/app.json na main.
name: APK do aplicativo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps/mobile/app.json]

permissions:
  contents: write # criar a Release com o APK

concurrency:
  group: mobile-apk
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@27.11.0

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Conferir o token da Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Falta o EXPO_TOKEN::Crie um token em expo.dev (Account settings → Access tokens) e salve no GitHub em Settings → Secrets and variables → Actions, com o nome EXPO_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar o código (tipos e testes)
        run: |
          npm run typecheck
          npm test

      - name: Versão do app
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION-$CODE" >> "$GITHUB_OUTPUT"

      - name: Pular se esta versão já foi publicada
        id: exists
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "A versão ${{ steps.version.outputs.tag }} já tem APK. Aumente version/versionCode no app.json para gerar outro."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ligar o projeto à conta da Expo
        if: steps.exists.outputs.skip != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # Cria o projeto na primeira vez; depois só reaproveita. A chave de assinatura do APK
        # é criada e guardada pela Expo no primeiro build (sempre a mesma, para o celular aceitar atualizações).
        run: npx --yes $EAS_CLI init --non-interactive --force

      - name: Gerar o APK na Expo (leva de 10 a 30 minutos)
        if: steps.exists.outputs.skip != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes $EAS_CLI build --platform android --profile preview --non-interactive --wait --json \
            --message "GitHub ${{ github.sha }}" > build.json
          node -e "
            const [build] = require('./build.json');
            const url = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl;
            if (!url) { console.error('O build terminou sem APK:', JSON.stringify(build)); process.exit(1); }
            require('fs').writeFileSync('apk-url.txt', url);
            console.log('Build', build.id, '→', url);
          "
          curl -fsSL "$(cat apk-url.txt)" -o "checkon-${{ steps.version.outputs.version }}.apk"
          ls -la *.apk

      - name: Publicar em Releases
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          printf '%s\n\n%s\n%s\n' \
            "APK do aplicativo CHECK-ON, versão ${{ steps.version.outputs.version }} (código ${{ steps.version.outputs.code }})." \
            "Para instalar: baixe o arquivo .apk no celular Android e permita a instalação de apps desta fonte." \
            "Para atualizar, instale o APK novo por cima do antigo: os dados do celular são mantidos." > "$RUNNER_TEMP/notes.md"
          # Rodada manual da mesma versão: substitui o APK anterior.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "checkon-${{ steps.version.outputs.version }}.apk" --clobber
          else
            gh release create "$TAG" "checkon-${{ steps.version.outputs.version }}.apk" \
              --target "${{ github.sha }}" \
              --title "Aplicativo CHECK-ON ${{ steps.version.outputs.version }} (Android)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          URL=$(gh release view "$TAG" --json url -q .url)
          echo "### APK pronto 📱" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe em: $URL" >> "$GITHUB_STEP_SUMMARY"

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: checkon_postgres
    environment:
      POSTGRES_USER: checkon_user
      POSTGRES_PASSWORD: checkon_password
      POSTGRES_DB: checkon_db
    ports:
      - "5432:5432"
    volumes:
      - checkon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkon_user -d checkon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: checkon_redis
    ports:
      - "6379:6379"
    volumes:
      - checkon_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  checkon_pgdata:
  checkon_redisdata:
